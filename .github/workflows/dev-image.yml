name: Build and publish development image

on:
  push:
    branches: [main]
    paths:
      - images/dev/**
      - test/dev-image.sh
      - .github/workflows/dev-image.yml
  pull_request:
    paths:
      - images/dev/**
      - test/dev-image.sh
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Select image tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/sun-dev"
          echo "rolling=$image:ubuntu26.04-llvm20" >> "$GITHUB_OUTPUT"
          echo "commit=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: images/dev
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          load: true
          tags: sun-dev:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sun-dev
          cache-to: type=gha,mode=max,scope=sun-dev

      - name: Smoke-test development tools
        run: |
          bash -n test/dev-image.sh
          docker run --rm -i sun-dev:test bash < test/dev-image.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ROLLING_TAG: ${{ steps.tags.outputs.rolling }}
          COMMIT_TAG: ${{ steps.tags.outputs.commit }}
        run: |
          docker tag sun-dev:test "$ROLLING_TAG"
          docker tag sun-dev:test "$COMMIT_TAG"
          docker push "$COMMIT_TAG"
          docker push "$ROLLING_TAG"
